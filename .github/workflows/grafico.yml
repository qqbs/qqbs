# Atualiza o gráfico de contribuições e publica na branch dados.
# A branch é recriada a cada execução (um único commit), fora da main.
# De hora em hora: repositório público não consome minutos pagos.

name: grafico

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  # Merge que mexe no gráfico publica na hora, sem esperar o agendamento
  push:
    branches: [main]
    paths: ['scripts/**', 'package*.json', '.github/workflows/grafico.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: grafico
  cancel-in-progress: true

jobs:
  grafico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Gerar contribuicoes.svg
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/grafico.mjs saida

      - name: Publicar na branch dados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd saida
          git init -q -b dados
          git config user.name 'phrónesis'
          git config user.email '95658302+qqbs@users.noreply.github.com'
          git add contribuicoes.svg
          git commit -qm 'Gráfico de contribuições'
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados

      # Keepalive: o GitHub desliga agendamentos após 60 dias sem atividade no
      # repositório; reativar o próprio workflow pela API zera essa contagem.
      - name: Manter o agendamento ativo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/grafico.yml/enable"
