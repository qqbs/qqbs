# Every commit is authored by phronesis, with no co-author trailer.
# The dados branch is rebuilt by the grafico workflow and is not checked here.

name: autor

on:
  push:
    branches-ignore: [dados]
  pull_request:

permissions:
  contents: read

jobs:
  autor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check authors
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..$SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="origin/main..$SHA"
          else
            range="$BEFORE..$SHA"
          fi

          email='95658302+qqbs@users.noreply.github.com'
          fail=0
          for c in $(git rev-list "$range"); do
            an=$(git log -1 --format='%an' "$c"); ae=$(git log -1 --format='%ae' "$c")
            cn=$(git log -1 --format='%cn' "$c"); ce=$(git log -1 --format='%ce' "$c")
            short=$(git log -1 --format='%h' "$c")
            if [ "$an" != "phronesis" ] || [ "$ae" != "$email" ]; then
              echo "::error::$short: author is '$an <$ae>'."; fail=1
            fi
            if { [ "$cn" != "phronesis" ] || [ "$ce" != "$email" ]; } && [ "$ce" != "noreply@github.com" ]; then
              echo "::error::$short: committer is '$cn <$ce>'."; fail=1
            fi
            if git log -1 --format='%B' "$c" | grep -Eiq '^co-authored-by:'; then
              echo "::error::$short: co-author trailer."; fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Authors ok."
          exit "$fail"
